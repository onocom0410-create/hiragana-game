<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>じゅうにし ロボ図鑑</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; padding:24px 16px 40px;
    background:linear-gradient(#1B2A4A,#31456E 55%,#4E6285);
    color:#fff; font-family:"Zen Maru Gothic",sans-serif;
    touch-action:manipulation;
  }
  h1{text-align:center; font-size:22px; margin:8px 0 20px;}
  .back{display:inline-block; margin-bottom:12px; color:#fff; text-decoration:none;
    background:rgba(255,255,255,.15); border-radius:12px; padding:7px 14px; font-weight:900; font-size:13px;}
  .grid{display:flex; flex-wrap:wrap; gap:16px; justify-content:center; max-width:640px; margin:0 auto;}
  .card{background:rgba(255,255,255,.08); border-radius:16px; padding:12px; width:110px; text-align:center;
    box-shadow:0 3px 0 rgba(0,0,0,.2);}
  .card svg{width:88px; height:88px;}
  .card .kanji{font-size:22px; font-weight:900; color:#FFC24B;}
  .card .name{font-size:13px; font-weight:700; margin-top:2px;}
</style>
</head>
<body>
<div id="lineBanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#06C755;color:#fff;font-size:12px;font-weight:700;padding:8px 34px 8px 12px;text-align:center;line-height:1.5;box-sizing:border-box;">
  📱 LINEの中で ひらいています。右上「⋮」から「ブラウザで開く」を選ぶと、もっと快適に あそべます!
  <button onclick="document.getElementById('lineBanner').remove()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:2px 8px;font-weight:900;cursor:pointer;">✕</button>
</div>
<script>if(/Line\//i.test(navigator.userAgent))document.getElementById('lineBanner').style.display='block';</script>
<div id="rotateOv" style="display:none;position:fixed;inset:0;z-index:999999;background:#1B2A4A;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;">
  <div style="font-size:56px;">📱↻</div>
  <p style="font-size:16px;font-weight:900;margin-top:10px;line-height:1.7;">たてに してね!<br>スマホを たてむきに もどしてね</p>
</div>
<style>@media (orientation:landscape) and (max-width:900px){ #rotateOv{display:flex !important;} }</style>
<script>
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
document.addEventListener('gestureend', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
// おなじ ばしょへの すばやい 連続タップだけを ダブルタップズームとして ふせぐ
// (タップした場所が ちがう時は はんおうを さまたげない)
let __lastTapTime = 0, __lastTapX = 0, __lastTapY = 0, __lastTapTarget = null;
document.addEventListener('touchend', function(e){
  const t = e.changedTouches && e.changedTouches[0];
  if(!t) return;
  const now = Date.now();
  const dx = Math.abs(t.clientX - __lastTapX), dy = Math.abs(t.clientY - __lastTapY);
  // おなじ要素への 連続タップの時だけ ふせぐ(ちがうボタンが 同じ場所に
  // 入れかわった時に、正当なタップまで 誤爆させないため)
  if(now - __lastTapTime <= 300 && dx < 30 && dy < 30 && e.target === __lastTapTarget) e.preventDefault();
  __lastTapTime = now; __lastTapX = t.clientX; __lastTapY = t.clientY; __lastTapTarget = e.target;
}, {passive:false});
</script>
<a class="back" href="index.html">⬅ もどる</a>

  front:'<path d="M80 78 q14 -4 10 -18" stroke="#8891A6" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M30 56 L14 52 M30 60 L14 62 M70 56 L86 52 M70 60 L86 62" stroke="#2b2b3a" stroke-width="2" stroke-linecap="round"/>'},
 {id:"ox",name:"うし",bg:"#B0805A",panel:"#7A5636",

  front:'<path d="M30 42 q6 4 2 10 M70 42 q-6 4 -2 10 M50 30 q4 4 0 8" stroke="#2b2b3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>'},

  front:'<path d="M30 58 q-10 4 -14 12 M70 58 q10 4 14 12" stroke="#2b2b3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>'},
 {id:"snake",name:"へび",bg:"#9B6FD1",panel:"#6A45A0",

 {id:"sheep",name:"ひつじ",bg:"#F5EDD8",panel:"#D8C79A",

 {id:"boar",name:"いのしし",bg:"#C97C6D",panel:"#96493C",

  front:'<ellipse cx="50" cy="62" rx="9" ry="6" fill="#F0A58C" stroke="#2b2b3a" stroke-width="2"/><circle cx="46" cy="62" r="1.6" fill="#2b2b3a"/><circle cx="54" cy="62" r="1.6" fill="#2b2b3a"/><path d="M40 66 L34 74 L40 72 Z" fill="#fff" stroke="#2b2b3a" stroke-width="1.5" stroke-linejoin="round"/><path d="M60 66 L66 74 L60 72 Z" fill="#fff" stroke="#2b2b3a" stroke-width="1.5" stroke-linejoin="round"/>'}

const KANJI = {rat:"子",ox:"丑",tiger:"寅",rabbit:"卯",dragon:"辰",snake:"巳",
  horse:"午",sheep:"未",monkey:"申",rooster:"酉",dog:"戌",boar:"亥"};
const grid = document.getElementById("grid");
ZODIAC.forEach(z=>{
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = zodiacBot(z.bg,z.panel,z.back,z.front)
    + `<div class="kanji">${KANJI[z.id]}</div><div class="name">${z.name}</div>`;
  grid.appendChild(d);
});
</script>
