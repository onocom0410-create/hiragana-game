<!DOCTYPE html>

<head>

<style>
  body {

    display: flex;
    flex-direction: column;

  h1 { color: #444; font-size: 28px; margin-bottom: 8px; }
  .card {
    display: block;
    width: 260px;
    padding: 24px;
    border-radius: 20px;
    background: #fff;
    text-decoration: none;
    color: #333;
    font-size: 22px;
    font-weight: 900;
    text-align: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }
  .card:active { transform: scale(0.97); }
</style>
</head>
<body>
<div id="lineBanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#06C755;color:#fff;font-size:12px;font-weight:700;padding:8px 34px 8px 12px;text-align:center;line-height:1.5;box-sizing:border-box;">

  <button onclick="document.getElementById('lineBanner').remove()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:2px 8px;font-weight:900;cursor:pointer;">✕</button>
</div>
<script>if(/Line\//i.test(navigator.userAgent))document.getElementById('lineBanner').style.display='block';</script>
<div id="rotateOv" style="display:none;position:fixed;inset:0;z-index:999999;background:#1B2A4A;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;">

</div>
<style>@media (orientation:landscape) and (max-width:900px){ #rotateOv{display:flex !important;} }</style>
<script>
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

document.addEventListener('touchmove', function(e){ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
